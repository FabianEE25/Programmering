<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript Intro</title>
</head>
<body>
  <script src="http://koda.nu/simple.js">
   
   var player = { x: 100, y: 300, size: 20, color: "blue", speed: 6 };

var zombie1 = { x: 300, y: 220, speed: 5 };
var zombie2 = { x: 500, y: 400, speed: 2 };
var zombie3 = { x: 700, y: 260, speed: 1 };
var speedzombie1 = { x: 900, y: 250, speed: 2}

function drawZombie(x, y) {
  rectangle(x + 3, y - 10, 23, 65, "lightgreen");
  rectangle(x + 3, y - 25, 23, 65, "gray");
  circle(x + 15, y - 40, 20, "lightgreen");
  circle(x, y - 40, 3, "red");
  rectangle(x - 35, y - 20, 30, 14, "lightgreen");
  rectangle(x - 20, y - 20, 30, 14, "gray");
  }

function drawspeedzombie(x, y) {
  rectangle(x + 3, y - 10, 23, 65, "lightblue");
  rectangle(x + 3, y - 25, 23, 65, "gray");
  circle(x + 15, y - 40, 20, "lightblue");
  circle(x, y - 40, 3, "red");
  rectangle(x - 35, y - 20, 30, 14, "lightblue");
  rectangle(x - 20, y - 20, 30, 14, "gray");
  }

function update() {
  clearScreen();
  text(20, 30, 24, "Zombiespelet", "black");

  drawZombie(zombie1.x, zombie1.y);
  drawZombie(zombie2.x, zombie2.y);
  drawZombie(zombie3.x, zombie3.y);
  drawspeedzombie(speedzombie1.x, speedzombie1.y);

  circle(player.x, player.y, player.size, player.color);

  if (keyboard.d) {
    player.x = player.x + player.speed;
  }
  if (keyboard.a) {
    player.x = player.x - player.speed;
  }
  if (keyboard.w) {
    player.y = player.y - player.speed;
  }
  if (keyboard.s) {
    player.y = player.y + player.speed;
  }
  if (keyboard.right) {
    zombie1.x = zombie1.x + zombie1.speed;
  }
  if (keyboard.left) {
    zombie1.x = zombie1.x - zombie1.speed;
  }
  if (keyboard.up) {
    zombie1.y = zombie1.y - zombie1.speed;
  }
  if (keyboard.down) {
    zombie1.y = zombie1.y + zombie1.speed;
  }
 

  // STEG 2: zombie1 jagar dig här

  if (distance(player, zombie1) < 65) {
    text(20, 70, 30, "AJ!", "red");
  }
  if (distance(player, speedzombie1) < 65) {
    text(20, 70, 30, "AJ!", "red");
  }

  if (zombie1.x < player.x) {zombie1.x = zombie1.x + zombie1.speed} // Höger
  if (zombie1.x > player.x) {zombie1.x = zombie1.x - zombie1.speed} // Vänster
  if (zombie1.y < player.y) {zombie1.y = zombie1.y + zombie1.speed} // Ned
  if (zombie1.y > player.y) {zombie1.y = zombie1.y - zombie1.speed} // Upp
  if (zombie2.x < player.x) {zombie2.x = zombie2.x + zombie2.speed} // Höger
  if (zombie2.x > player.x) {zombie2.x = zombie2.x - zombie2.speed} // Vänster
  if (zombie2.y < player.y) {zombie2.y = zombie2.y + zombie2.speed} // Ned
  if (zombie2.y > player.y) {zombie2.y = zombie2.y - zombie2.speed} // Upp
  if (zombie3.x < player.x) {zombie3.x = zombie3.x + zombie3.speed} // Höger
  if (zombie3.x > player.x) {zombie3.x = zombie3.x - zombie3.speed} // Vänster
  if (zombie3.y < player.y) {zombie3.y = zombie3.y + zombie3.speed} // Ned
  if (zombie3.y > player.y) {zombie3.y = zombie3.y - zombie3.speed} // Upp
  if (speedzombie1.x < player.x) {speedzombie1.x = speedzombie1.x + speedzombie1.speed} // Höger
  if (speedzombie1.x > player.x) {speedzombie1.x = speedzombie1.x - speedzombie1.speed} // Vänster
  if (speedzombie1.y < player.y) {speedzombie1.y = speedzombie1.y + speedzombie1.speed} // Ned
  if (speedzombie1.y > player.y) {speedzombie1.y = speedzombie1.y - speedzombie1.speed} // Upp

  console.log("Zombie X: " + zombie1.x)
  console.log("Zombie Y: " + zombie1.y)
}











  </script>
</body>
</html>
