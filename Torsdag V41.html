<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript Intro</title>
</head>
<body>
  <script src="http://koda.nu/simple.js">
    try { 
        nagotSOmInteFinns();}
        catch (fel) { 
            console.log("Fånagde ett fel: " + fel.message);
        }

    
    var player = { x: 100, y: 300, size: 20, color: "blue", speed: 4 };

var zombie1 = { x: 300, y: 220, speed: 2 };
var zombie2 = { x: 500, y: 400, speed: 2 };
var zombie3 = { x: 700, y: 260,  speed: 2};
var poang = 0;

function drawZombie(x, y) {
  save();
  translate(x, y);
  rectangle(3, -10, 23, 65, "lightgreen");
  rectangle(3, -25, 23, 65, "gray");
  circle(15, -40, 20, "lightgreen");
  circle(0, -40, 3, "red");
  rectangle(-35, -20, 30, 14, "lightgreen");
  rectangle(-20, -20, 30, 14, "gray");
  restore();
}

function update() {
  clearScreen();
  text(20, 30, 24, "Zombiespelet", "black");

  drawZombie(zombie1.x, zombie1.y);
  drawZombie(zombie2.x, zombie2.y);
  drawZombie(zombie3.x, zombie3.y);

  circle(player.x, player.y, player.size, player.color);

  if (keyboard.d) {
    player.x = player.x + player.speed;
  }
  if (keyboard.a) {
    player.x = player.x - player.speed;
  }
  if (keyboard.w) {
    player.y = player.y - player.speed;
  }
  if (keyboard.s) {
    player.y = player.y + player.speed;
  }

  if (zombie1.x < player.x) {
    zombie1.x = zombie1.x + zombie1.speed;
  }
  if (zombie1.x > player.x) {
    zombie1.x = zombie1.x - zombie1.speed;
  }
  if (zombie1.y < player.y) {
    zombie1.y = zombie1.y + zombie1.speed;
  }
  if (zombie1.y > player.y) {
    zombie1.y = zombie1.y - zombie1.speed;
  }
  if (zombie2.x < player.x) {zombie2.x = zombie2.x + zombie2.speed;}
  if (zombie2.x > player.x) {zombie2.x = zombie2.x - zombie2.speed;}
  if (zombie2.y < player.y) {zombie2.y = zombie2.y + zombie2.speed;}
  if (zombie2.y > player.y) {zombie2.y = zombie2.y - zombie2.speed;}
  if (distance(player, zombie2) < 65) {text(280, 250, 50, "GAME OVER", "red"); stopUpdate();} else {poang = poang + 1; }

  if (distance(player, zombie1) < 65) {
    text(280, 250, 50, "GAME OVER", "red");
    stopUpdate();
  } else {
    poang = poang + 1;
    text(20, 70, 24, "Poäng: " + poang, "black");
  }
  console.log(distance(player, zombie2));
  //Felen i koden ovan är att det saknas e i distance. Det ska vara distance men det står distanc. Samnt så står det zombie1 istället för zombie2 i en av raderna. 

  // STEG 2 kommer här
  if (zombie3.x < player.x) {zombie3.x = zombie3.x + zombie3.speed;}
  if (zombie3.x > player.x) {zombie3.x = zombie3.x - zombie3.speed;}  //console.log(distance(player, zombie3));
  if (zombie3.y < player.y) {zombie3.y = zombie3.y + zombie3.speed;}
  if (zombie3.y > player.y) {zombie3.y = zombie3.y - zombie3.speed;}
  if (distance(player, zombie3) < 65) {text(280, 250, 50, "GAME OVER", "red"); stopUpdate();} //else {poang = poang + 1;}
}








  </script>
</body>
</html>
