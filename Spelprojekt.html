<body>
  <script src="http://koda.nu/simple.js">

 // Pseudokod
// Spelarens rörelse
// OM spelaren trycker på W, A, S eller D:
//Flytta spelaren åt rätt håll
// Zombie och krock
// OM en zombie rör vid spelaren:
//Ta bort 1 liv

 // Pseudokod 
// Förlustvillkor
// OM spelarens liv är 0:
//Avsluta spelet och visa "GAME OVER"
// Waves
// OM alla zombies är besegrade:
//Starta nästa wave med fler zombies

// Variable för spelaren
var player = {
    x: 100,
    y: 200,
    speed: 3,
    lives: 3
}
// Array för zombies
var zombies = [];
// Variabel för antal zombies i början av spelet    
var antalZombies = 3;
// Variable för poäng, waves och zombies
// Poäng
var poang = 0;
// Waves
var wave = 0;
//Skyddstid
var skyddstid = 0

//Vapen
var kulor = []

var vapen = {
    damage: 1,
    speed: 8,
    cooldown:3
};

var sjkuttid = 0;



//Funktion för att skapa zombies efter varje wave i sin egen Loop. 
function skapaZombies(){
    wave = wave + 1;
    for (var i = 0; i < antalZombies; i++) {
        var zombie = {
            x: random(0, totalWidth),
            y: random(0, totalHeight),
            hp: 2, 
            speed: 1,
            color: "green"
        };
        zombies.push(zombie);
    }
    antalZombies = antalZombies + 1;
}

//Skjuta och sikta med musen. 
 

    

        



// Funktion för att rita spelaren och röra sig. 
function update() {
clearScreen(); 
circle(player.x, player.y, 20, "blue");
if (zombies.length == 0) {
    skapaZombies();
   
    
}
// Rörelse Loop för Zombies som spawnar och redan finns inladdade.
for (var i = 0; i < zombies.length; i++) {
    circle(zombies[i].x, zombies[i].y, 20, zombies[i].color);
     if (zombies[i].x < player.x) {zombies[i].x = zombies[i].x + zombies[i].speed}
     if (zombies[i].x > player.x) {zombies[i].x = zombies[i].x - zombies[i].speed}
     if (zombies[i].y < player.y) {zombies[i].y = zombies[i].y + zombies[i].speed}
     if (zombies[i].y > player.y) {zombies[i].y = zombies[i].y - zombies[i].speed}
     // 
     if (distance(player, zombies[i]) < 30) {
     if(player.lives == 0)
     text (280, 250, 50,  "WASTED", "RED") }
    
}
// Rörelse för spelaren (Tagentbord)
if (keyboard.w) {player.y = player.y - player.speed;}
if (keyboard.s) {player.y = player.y + player.speed;}
if (keyboard.a) {player.x = player.x - player.speed;} 
if (keyboard.d) {player.x = player.x + player.speed;}





// Spel information
text(20, 40, 40, "Lives " + player.lives, "Red")
text(1400, 40, 40, "Poäng " + poang, "Red" )
text(700, 40, 40, "Wave " + wave, "red")













    
}







  </script>
</body>
