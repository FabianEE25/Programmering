<body>
  <script src="http://koda.nu/simple.js">


    // När filen sparas så sparas koden på datorn

    // Datorn tolkar koden och kör den i webbläsaren. 
    // Resultatet visas på skärmen. 
    
    // Med mina kunskaper i JavaScript så kan jag inte riktigt tänka på något, men ett mål kan vara att göra nått programm
    // som kan underlätta vardagen för människor. Kanske innom sjukvården eller skolan. Men mina kunskaper är väldigt grundläggande. 
    
    // Den samhällsfråga som intresserar mig mest är cybersäkerhet. Genom programmering kan man skapa säkra system som skyddar data och personlig information från hackare.
    //  Detta är viktigt för mig eftersom allt fler delar av vårt samhälle blir beroende av internet och datorer. Dålig säkerhet kan drabba privatpersoner, företag och myndigheter. 
    // Därför tycker jag att det är viktigt att skapa säkra system och program.





    var player = {x: 200, y: 300, size: 20, color: "red", speed: 8 };

    var enemy1 = {x: 400, y: 100, size: 15, speed: 4};
    var poang = 0; 

    function update() {
        clearScreen()
        fill("black")
    circle(enemy1.x, enemy1.y, enemy1.size, "red");
  
    circle(player.x, player.y, player.size, "blue");
    if(keyboard.d){player.x = player.x + player.speed;}
    if(keyboard.a){player.x = player.x - player.speed;}
    if(keyboard.w){player.y = player.y - player.speed;}
    if(keyboard.s){player.y = player.y + player.speed;}
    
    if (enemy1.x < player.x){enemy1.x = enemy1.x + enemy1.speed;}
    if (enemy1.x > player.x){enemy1.x = enemy1.x - enemy1.speed;}
    if (enemy1.y < player.y){enemy1.y = enemy1.y + enemy1.speed;}
    if (enemy1.y > player.y){enemy1.y = enemy1.y - enemy1.speed;}
   
    
    if(distance(player, enemy1) < 30) {
        picture(0, 0, "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRpifaW6lA8D-6HTyuBQ6HqEFv9Sf93wY5Povc9V83LiQ&s=10", totalWidth, totalHeight)
    
    //{text(250, 200, 50,  "GAME OVER", "red") 
    stopUpdate()}

   

}


   



  




  </script>
</body>
