<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kapitel 1 Lektion 1</title>
</head>
<body>
  <script src="http://koda.nu/simple.js">


   var player = {
      x: 100,
      y: 800,
      size: 40,
      speedX: 5,  // km/h //Med 0, så blir bollen fallande. Bollen har 1 riktning.
      speedY: 0, // km/h //Med -2, så rör sig bollen uppåt
      directionX: 5, // Beroende på om riktning är 1 eller -1, så rör sig bollen åt höger eller vänster.
      directionY: 5, // Beroende på om riktning är 1 eller -1, så rör sig bollen uppåt eller nedåt.
      color: mixColor(random(256), random(256), random(256))
    };

    var enemy = {
        x: 100,
        y: 100,
        bredd: 50,
        hojd: 50,
        color: "red",
        speedX: 5, 
        speedY: 0, 
        directionX: 1, 
        directionY:  1
    }




   
    function update() {
   clearScreen();
     circle(player.x, player.y, player.size, player.color);

   player.x = player.x + player.speedX * player.directionX;  
   player.y = player.y + player.speedY * player.directionY;
   player.color = mixColor(random(256), random(256), random(256));

   rectangle(enemy.x, enemy.y, enemy.bredd, enemy.hojd, enemy.color);
  // enemy.x = enemy.x + enemy.speedX * enemy.directionX;


   setTimeout(() => {
    enemy.x = enemy.x + mouse.x / 100
   }, 1000)


   enemy.y = enemy.y + enemy.speedY * enemy.directionY;



   console.log(player.x) // Men console kan man i sin live server se exakta koorinator på vart bollen är på skärmen.

   



   
  if(player.x >= totalWidth) {player.x = 0;}
  if(player.y >= totalHeight) {player.y = 0;}
  if(enemy.x >= totalWidth) {enemy.x = 0;}
  if(enemy.y >= totalHeight) {enemy.y = 0;}
    }       




















  </script>
</body>
</html>
